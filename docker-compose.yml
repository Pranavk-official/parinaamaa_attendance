services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/attendance
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      OFFICE_IP_ADDRESS: ${OFFICE_IP_ADDRESS:-}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
    # ofelia waits on this; without it compose refuses to start the scheduler.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://127.0.0.1:3000/login'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    labels:
      ofelia.enable: "true"
      ofelia.job-exec.payroll.schedule: "0 0 1 * *"
      # Runs inside the web container, which has bun but no wget or curl, and
      # reads CRON_SECRET from that container instead of leaking it into a label.
      ofelia.job-exec.payroll.command: "bun -e \"const r = await fetch('http://127.0.0.1:3000/api/cron/export-payroll', { method: 'POST', headers: { authorization: 'Bearer ' + process.env.CRON_SECRET } }); if (!r.ok) { console.error(r.status); process.exit(1) }\""

volumes:
  pgdata: