services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: attendance
    networks:
      - internal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 on purpose. Without it pg_isready checks the Unix socket,
      # which the entrypoint's temporary init server answers before the real
      # server listens on TCP — the container reports healthy, web starts, and
      # Prisma gets P1001. Only the TCP check means "ready for a client".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot data seed: restores users, employee IDs, attendance, leaves,
  # balances and salary history into a fresh database on first deploy, then
  # never again — the guard skips when users already exist. restart "no" so
  # it does not loop; web waits for it to finish.
  data-migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./prisma/seed-v2-data.sql:/seed-v2-data.sql:ro
    command:
      - sh
      - -c
      - |
        users=$$(psql -h db -U postgres -d attendance -tAc 'select count(*) from "user"' 2>/dev/null) || users=empty
        if [ "$$users" = "0" ] || [ "$$users" = "empty" ]; then
          psql -h db -U postgres -d attendance -f /seed-v2-data.sql && echo "data restored"
        else
          echo "users present ($$users) — skipping one-shot restore"
        fi
    networks:
      - internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      target: prod
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    # One port for both sides: published on the host, and what Next listens on.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/attendance
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      OFFICE_IP_ADDRESS: ${OFFICE_IP_ADDRESS:-}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
    # ofelia waits on this; without it compose refuses to start the scheduler.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const p = process.env.PORT || 3000; const r = await fetch('http://127.0.0.1:' + p + '/login'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
      data-migrate:
        condition: service_completed_successfully
    # List form, not a mapping: Dokploy appends its own Traefik labels to
    # this list at deploy time, and cannot merge them into a mapping.
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.payroll.schedule=0 0 1 * *"
      # Runs inside this container, which has bun but no wget or curl, and
      # reads CRON_SECRET and PORT from its own environment.
      - "ofelia.job-exec.payroll.command=bun -e \"const p = process.env.PORT || 3000; const r = await fetch('http://127.0.0.1:' + p + '/api/cron/export-payroll', { method: 'POST', headers: { authorization: 'Bearer ' + process.env.CRON_SECRET } }); if (!r.ok) { console.error(r.status); process.exit(1) }\""
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

networks:
  # Private to this stack: Postgres and the scheduler are never reachable from
  # outside it.
  internal:
    driver: bridge
  # Dokploy's shared network, where its Traefik lives. Only the web service
  # joins it, so a domain attached in Dokploy can reach the app. Not on
  # Dokploy? Run `docker network create dokploy-network` once, or delete this
  # network and web's reference to it.
  dokploy-network:
    external: true

volumes:
  pgdata: